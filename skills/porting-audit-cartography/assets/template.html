<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porting Audit Map</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#d0d7e2; --bg:#f6f8fb; --panel:#fff; --accent:#0f766e; --risk:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    main { max-width:1180px; margin:0 auto; padding:32px 20px 44px; }
    header { display:grid; grid-template-columns:170px 1fr; gap:18px; margin-bottom:18px; }
    .score, section { border:1px solid var(--line); border-radius:8px; background:var(--panel); }
    .score { padding:22px; background:var(--ink); color:white; }
    .score b { display:block; font-size:54px; line-height:1; }
    .score span { color:#d8dee9; }
    .summary { padding:20px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
    h1 { margin:0 0 8px; font-size:24px; letter-spacing:0; }
    h2 { margin:0 0 12px; font-size:16px; }
    p { margin:5px 0; color:var(--muted); overflow-wrap:anywhere; }
    section { padding:18px; margin-top:14px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { text-align:left; color:var(--muted); border-bottom:1px solid var(--line); padding:9px 7px; }
    td { border-bottom:1px solid var(--line); padding:11px 7px; vertical-align:top; }
    td span { display:block; color:var(--muted); margin-top:3px; }
    .bar { height:10px; min-width:110px; background:#e6ebf2; border-radius:999px; overflow:hidden; }
    .bar i { display:block; height:100%; background:var(--accent); }
    ul { margin:0; padding-left:20px; }
    li { margin:9px 0; }
    li span, li em { display:block; color:var(--muted); font-style:normal; margin-top:3px; }
    @media (max-width:760px) { header { grid-template-columns:1fr; } table { display:block; overflow-x:auto; white-space:nowrap; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="score"><b>__SCORE__</b><span>__GRADE__</span></div>
      <div class="summary">
        <h1>Porting Audit Map</h1>
        <p><strong>Target:</strong> __TARGET__</p>
        <p><strong>Source:</strong> __SOURCE__</p>
        <p><strong>Generated:</strong> __GENERATED_AT__</p>
      </div>
    </header>
    <section><h2>Category Map</h2><table><thead><tr><th>Category</th><th>Score</th><th>Bar</th><th>Evidence</th><th>Gap</th></tr></thead><tbody>__CATEGORY_ROWS__</tbody></table></section>
    <section><h2>Findings</h2><ul>__FINDINGS__</ul></section>
    <section><h2>ROI Actions</h2><ul>__ACTIONS__</ul></section>
  </main>
</body>
</html>
